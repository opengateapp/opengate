name: Feature idea or feedback
description: Something you'd like Open Gate to do, or do better.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: Issues are public, so keep private project details out.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In Open Gate or another tool, or by hand.
  - type: dropdown
    id: importance
    attributes:
      label: How important is it to you?
      options:
        - Nice to have
        - It would help a lot
        - I can't use Open Gate without it
  - type: input
    id: version
    attributes:
      label: App version
  - type: input
    id: environment
    attributes:
      label: Web or desktop, browser, system, screen size
