name: Question
description: Ask how something works.
labels: [question]
body:
  - type: markdown
    attributes:
      value: Check the FAQ in the app first (Help → FAQ). Issues are public, so keep private project details out.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
  - type: input
    id: environment
    attributes:
      label: Web or desktop, browser, system, screen size
